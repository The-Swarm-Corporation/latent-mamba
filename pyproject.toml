[project]
name = "latent-mamba"
version = "0.2.0"
description = "Latent Mamba: adaptive continuous reasoning in constant memory"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kye Gomez", email = "kye@swarms.world" }]
requires-python = ">=3.10"
# The model (latent_mamba/main.py) needs only PyTorch.
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
# Training, evaluation and benchmarking pipeline (latent_mamba/train.py).
# Pinned to the versions the pipeline was tested with.
train = [
    "transformers==5.16.1",
    "huggingface_hub==1.7.2",
    "wandb==0.19.5",
    "setuptools",  # provides distutils, which wandb 0.19 imports
]
# Fused CUDA kernels: mamba_ssm's chunked scan and single step, and
# causal-conv1d's single-token conv. Linux + CUDA only; the code falls back to
# the reference kernels without them. Install after the rest, so the build
# sees the installed torch:  uv sync --extra train && uv sync --extra train --extra cuda
cuda = [
    "mamba-ssm==2.3.1; sys_platform == 'linux'",
    "causal-conv1d==1.7.0; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/The-Swarm-Corporation/latent-mamba"
Paper = "https://github.com/The-Swarm-Corporation/latent-mamba/blob/main/docs/paper.pdf"
Checkpoints = "https://huggingface.co/kye/latent-mamba"

[dependency-groups]
dev = ["pyflakes>=3.2"]

[tool.uv]
# The code runs as scripts (`uv run latent_mamba/train.py ...`), so there is
# nothing to build or install: uv only manages the environment.
package = false

# mamba-ssm and causal-conv1d ship only as source and need torch to build.
# Their metadata is given here so locking (also on macOS) never builds them,
# and they are built against the torch already installed in the environment.
[[tool.uv.dependency-metadata]]
name = "mamba-ssm"
version = "2.3.1"
requires-dist = ["torch", "triton", "ninja", "einops", "transformers", "packaging", "setuptools>=61.0.0"]

[[tool.uv.dependency-metadata]]
name = "causal-conv1d"
version = "1.7.0"
requires-dist = ["torch", "packaging", "ninja"]

[tool.uv.extra-build-dependencies]
mamba-ssm = [{ requirement = "torch", match-runtime = true }, "packaging", "ninja", "wheel"]
causal-conv1d = [{ requirement = "torch", match-runtime = true }, "packaging", "ninja", "wheel"]
